
# Increases the amount of memory Gradle can use and optimizes the GC
# -XX:+UseZGC
    org.gradle.jvmargs=-Xmx4G
# Helps with build times
    org.gradle.parallel=true
# Caches Dependencies for faster build times.
    org.gradle.caching=false

# Fabric Properties
	# Get new versions at https://fabricmc.net/develop and https://lambdaurora.dev/tools/import_quilt.html
	minecraft_version=26.2
    fabric_loader_version=0.19.3
    min_fabric_loader_version=0.19.0

# Mod Properties
	mod_id = wilderwild
	mod_name = Wilder Wild
	mod_author = FrozenBlock
	mod_version = 5.0
    # protocol version must be changed after each update with dual env changes
    protocol_version = 19
	maven_group = net.frozenblock
	archives_base_name = WilderWild
	java_version = 25
	license = FrozenBlock Modding Oasis License v1.0
	repository = FrozenBlock/WilderWild

# Publishing
	modrinth_project_id = AtHRJSUW
	curseforge_project_id = 648511

# Dependencies
	fabric_api_version=0.152.1+26.2
	frozenlib_version=3.0-mc26.2
# External Mods
    modmenu_version=20.0.1
    cloth_config_version=26.2.155
	copperpipes_version=2.1.6-mc26.1
    terrablender_version=26.1.0.1
# Biolith
    biolith_version=3.6.0-beta.1
    run_biolith=false
# Optimization
	sodium_version=0.9.1-beta.4+mc26.2
    run_sodium = true

# NeoForge Properties (verify versions against the snapshot maven)
    neoforge_version=26.2.0.49-beta
    neoforge_loader_version_range=[4,)

# Optional: set to a PR/snapshot NeoForge maven URL, or leave blank to skip
    neoforge_snapshot_maven=
